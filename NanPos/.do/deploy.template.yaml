spec:
  name: possoft-setup
  databases:
  - name: possoftdb
    engine: MYSQL
    production: true
    cluster_name: ns
    db_name: possoft
    db_user: possoftuser
  services:
  - environment_slug: php
    name: possoft
    git:
      repo_clone_url: https://github.com/blair2004/PosSOFT-4x
      branch: v4.7.x
    build_command: npm run prod
    run_command: heroku-php-apache2 public/
