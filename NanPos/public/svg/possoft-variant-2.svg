    <path d="M169 66 C179 83 177 105 164 121 C151 137 130 143 104 149 L74 156 C56 160 44 171 35 187 L35 151 C35 129 50 111 74 103 C93 96 118 94 137 87 C153 81 164 74 169 66 Z" fill="url(#orange)"/>
    <path d="M35 151 C43 133 57 123 76 119 C88 116 101 113 114 109 C130 104 143 96 153 84 C151 105 136 119 114 126 C97 132 78 134 64 145 C53 153 47 166 47 181 H35 Z" fill="url(#blueSide)" opacity=".98"/>
  </g>
</svg>
