<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190.64 190.64" role="img" aria-labelledby="title desc">
  <title id="title">PosSoft symbol</title>
  <desc id="desc">Abstract blue and orange ribbon monogram representing PosSoft.</desc>
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08B9F4"/><stop offset=".52" stop-color="#0878E8"/><stop offset="1" stop-color="#123DAF"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD52A"/><stop offset=".48" stop-color="#FF8A00"/><stop offset="1" stop-color="#F04A13"/>
    </linearGradient>
    <linearGradient id="blueSide" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#078DEB"/><stop offset="1" stop-color="#0752C5"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5" result="blur"/>
      <feOffset dy="1" result="offset"/>
      <feComponentTransfer in="offset" result="shadow"><feFuncA type="linear" slope=".15"/></feComponentTransfer>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
