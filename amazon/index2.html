<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Product Research Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left h1 {
            color: #333;
            font-size: 2em;
            margin-bottom: 5px;
        }

        .header-left p {
            color: #666;
        }

        .header-buttons {
            display: flex;
            gap: 10px;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 14px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .btn-success {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.6);
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background-color: white;
            margin: 3% auto;
            padding: 0;
            border-radius: 15px;
            width: 90%;
            max-width: 800px;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideDown 0.3s;
        }

        @keyframes slideDown {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px 30px;
            border-radius: 15px 15px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            font-size: 1.8em;
        }

        .close {
            color: white;
            font-size: 35px;
            font-weight: bold;
            cursor: pointer;
            line-height: 1;
        }

        .close:hover {
            opacity: 0.7;
        }

        .modal-body {
            padding: 30px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            display: block;
            color: #555;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.95em;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: all 0.3s;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .table-container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow-x: auto;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1000px;
        }

        th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            text-align: left;
            font-weight: 600;
            cursor: pointer;
            user-select: none;
            position: relative;
        }

        th:hover {
            opacity: 0.9;
        }

        th::after {
            content: ' ⇅';
            opacity: 0.5;
            font-size: 0.8em;
        }

        th.sort-asc::after {
            content: ' ▲';
            opacity: 1;
        }

        th.sort-desc::after {
            content: ' ▼';
            opacity: 1;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #e0e0e0;
        }

        tr:hover {
            background-color: #f8f9fa;
        }

        .action-btns {
            display: flex;
            gap: 8px;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 0.85em;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-view {
            background: #4CAF50;
            color: white;
        }

        .btn-edit {
            background: #2196F3;
            color: white;
        }

        .btn-delete {
            background: #f44336;
            color: white;
        }

        .btn-small:hover {
            transform: scale(1.05);
            opacity: 0.9;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .stat-number {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.9em;
            color: #666;
        }

        .column-selector {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .column-selector h3 {
            margin-bottom: 15px;
            color: #333;
        }

        .column-options {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
        }

        .column-option {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .column-option input[type="checkbox"] {
            width: auto;
            cursor: pointer;
        }

        .column-option label {
            margin: 0;
            font-weight: normal;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 20px;
            }

            .header-buttons {
                flex-direction: column;
                width: 100%;
            }

            .header-buttons .btn {
                width: 100%;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .modal-content {
                width: 95%;
                margin: 10% auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-left">
                <h1>🛒 Amazon Product Research Tracker</h1>
                <p>Track and manage your product research efficiently</p>
            </div>
            <div class="header-buttons">
                <button class="btn" onclick="openModal()">➕ Add Product</button>
                <button class="btn btn-success" onclick="toggleColumnSelector()">⚙️ Columns</button>
                <button class="btn btn-secondary" onclick="exportToJSON()">📥 Export</button>
            </div>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="totalProducts">0</div>
                <div class="stat-label">Total Products</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="avgPrice">$0</div>
                <div class="stat-label">Average Price</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalRevenue">$0</div>
                <div class="stat-label">Total Revenue</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="avgProfit">$0</div>
                <div class="stat-label">Avg Profit Margin</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="avgRating">0</div>
                <div class="stat-label">Average Rating</div>
            </div>
        </div>

        <div class="table-container">
            <div id="columnSelectorContainer" style="display: none;">
                <div class="column-selector">
                    <h3>📋 Select Columns to Display</h3>
                    <div class="column-options" id="columnOptions"></div>
                </div>
            </div>

            <div class="controls">
                <input type="text" class="search-box" id="searchBox" placeholder="🔍 Search products...">
                <button class="btn btn-secondary" onclick="clearAll()">🗑️ Clear All</button>
            </div>

            <div id="tableWrapper">
                <div class="empty-state">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path>
                    </svg>
                    <p>No products saved yet. Click "Add Product" to start!</p>
                </div>
            </div>
        </div>
    </div>

    <div id="productModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">➕ Add New Product</h2>
                <span class="close" onclick="closeModal()">&times;</span>
            </div>
            <div class="modal-body">
                <form id="productForm">
                    <input type="hidden" id="editId">
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="productName">Product Name *</label>
                            <input type="text" id="productName" required placeholder="Enter product name">
                        </div>

                        <div class="form-group">
                            <label for="asin">ASIN</label>
                            <input type="text" id="asin" placeholder="Amazon ASIN code">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="category">Category</label>
                            <select id="category">
                                <option value="">Select Category</option>
                                <option value="Electronics">Electronics</option>
                                <option value="Home & Kitchen">Home & Kitchen</option>
                                <option value="Kitchen & Dining">Kitchen & Dining</option>
                                <option value="Toys & Games">Toys & Games</option>
                                <option value="Sports & Outdoors">Sports & Outdoors</option>
                                <option value="Beauty & Personal Care">Beauty & Personal Care</option>
                                <option value="Books">Books</option>
                                <option value="Clothing">Clothing</option>
                                <option value="Clothing, Shoes & Jewelry">Clothing, Shoes & Jewelry</option>
                                <option value="Industrial & Scientific">Industrial & Scientific</option>
                                <option value="Health">Health</option>
                                <option value="Automotive">Automotive</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="price">Selling Price ($)</label>
                            <input type="number" id="price" step="0.01" placeholder="0.00">
                        </div>
                    </div>

                    


                    <div class="form-row">
                        <div class="form-group">
                            <label for="supplier">Supplier</label>
                            <input type="text" id="supplier" placeholder="Supplier name (optional)">
                        </div>

                        <div class="form-group">
                            <label for="supplierPrice">Supplier Price ($)</label>
                            <input type="number" id="supplierPrice" step="0.01" placeholder="0.00">
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="fbaCost">FBA Cost ($)</label>
                            <input type="number" id="fbaCost" step="0.01" placeholder="0.00">
                        </div>

                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="monthlySales">Monthly Sales (Units)</label>
                            <input type="number" id="monthlySales" placeholder="0">
                        </div>

                        <div class="form-group">
                            <label for="monthlyRevenue">Monthly Revenue ($)</label>
                            <input type="number" id="monthlyRevenue" step="0.01" placeholder="Auto-calculated">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="rating">Rating (1-5)</label>
                            <input type="number" id="rating" step="0.1" min="1" max="5" placeholder="4.5">
                        </div>

                        <div class="form-group">
                            <label for="reviews">Number of Reviews</label>
                            <input type="number" id="reviews" placeholder="0">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="bsr">Best Seller Rank</label>
                            <input type="text" id="bsr" placeholder="e.g., #1,234 in Electronics">
                        </div>

                        <div class="form-group">
                            <label for="url">Product URL</label>
                            <input type="url" id="url" placeholder="https://amazon.com/...">
                        </div>
                    </div>

                    <div class="form-group full-width">
                        <label for="notes">Notes</label>
                        <textarea id="notes" placeholder="Add any notes or observations..."></textarea>
                    </div>

                    <button type="submit" class="btn" style="width: 100%;">💾 Save Product</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        let products = [];
        let sortColumn = null;
        let sortDirection = 'asc';
        let editingId = null;

        const allColumns = [
            { key: 'name', label: 'Product Name', default: true },
            { key: 'asin', label: 'ASIN', default: true },
            { key: 'category', label: 'Category', default: true },
            { key: 'price', label: 'Selling Price', default: true },
            { key: 'supplier', label: 'Supplier', default: false },
            { key: 'supplierPrice', label: 'Supplier Price', default: true },
            { key: 'fbaCost', label: 'FBA Cost', default: true },
            { key: 'monthlySales', label: 'Monthly Sales', default: true },
            { key: 'monthlyRevenue', label: 'Monthly Revenue', default: true },
            { key: 'rating', label: 'Rating', default: true },
            { key: 'reviews', label: 'Reviews', default: false },
            { key: 'bsr', label: 'BSR', default: false },
            { key: 'dateAdded', label: 'Date Added', default: true }
        ];

        let visibleColumns = {};

        function initializeColumns() {
            const saved = localStorage.getItem('visibleColumns');
            if (saved) {
                visibleColumns = JSON.parse(saved);
            } else {
                allColumns.forEach(col => {
                    visibleColumns[col.key] = col.default;
                });
            }
            renderColumnSelector();
        }

        function renderColumnSelector() {
            const container = document.getElementById('columnOptions');
            container.innerHTML = allColumns.map(col => `
                <div class="column-option">
                    <input type="checkbox" id="col_${col.key}" ${visibleColumns[col.key] ? 'checked' : ''} 
                           onchange="toggleColumn('${col.key}')">
                    <label for="col_${col.key}">${col.label}</label>
                </div>
            `).join('');
        }

        function toggleColumn(key) {
            visibleColumns[key] = !visibleColumns[key];
            localStorage.setItem('visibleColumns', JSON.stringify(visibleColumns));
            displayProducts();
        }

        function toggleColumnSelector() {
            const container = document.getElementById('columnSelectorContainer');
            container.style.display = container.style.display === 'none' ? 'block' : 'none';
        }

        function openModal(id = null) {
            editingId = id;
            const modal = document.getElementById('productModal');
            const form = document.getElementById('productForm');
            
            if (id) {
                const product = products.find(p => p.id === id);
                if (product) {
                    document.getElementById('modalTitle').textContent = '✏️ Edit Product';
                    document.getElementById('editId').value = id;
                    document.getElementById('productName').value = product.name || '';
                    document.getElementById('asin').value = product.asin || '';
                    document.getElementById('category').value = product.category || '';
                    document.getElementById('price').value = product.price || '';
                    document.getElementById('supplier').value = product.supplier || '';
                    document.getElementById('supplierPrice').value = product.supplierPrice || '';
                    document.getElementById('fbaCost').value = product.fbaCost || '';
                    document.getElementById('monthlySales').value = product.monthlySales || '';
                    document.getElementById('monthlyRevenue').value = product.monthlyRevenue || '';
                    document.getElementById('rating').value = product.rating || '';
                    document.getElementById('reviews').value = product.reviews || '';
                    document.getElementById('bsr').value = product.bsr || '';
                    document.getElementById('url').value = product.url || '';
                    document.getElementById('notes').value = product.notes || '';
                }
            } else {
                document.getElementById('modalTitle').textContent = '➕ Add New Product';
                form.reset();
                document.getElementById('editId').value = '';
            }
            
            modal.style.display = 'block';
        }

        function closeModal() {
            document.getElementById('productModal').style.display = 'none';
            document.getElementById('productForm').reset();
            editingId = null;
        }

        window.onclick = function(event) {
            const modal = document.getElementById('productModal');
            if (event.target == modal) {
                closeModal();
            }
        }

        function loadProducts() {
            const saved = localStorage.getItem('amazonProducts');
            if (saved) {
                products = JSON.parse(saved);
                displayProducts();
                updateStats();
            }
        }

        function saveProducts() {
            localStorage.setItem('amazonProducts', JSON.stringify(products));
            updateStats();
        }

        function updateStats() {
            document.getElementById('totalProducts').textContent = products.length;
            
            const prices = products.map(p => parseFloat(p.price) || 0).filter(p => p > 0);
            const avgPrice = prices.length > 0 ? prices.reduce((a, b) => a + b, 0) / prices.length : 0;
            document.getElementById('avgPrice').textContent = '$' + avgPrice.toFixed(2);
            
            const revenues = products.map(p => parseFloat(p.monthlyRevenue) || 0);
            const totalRevenue = revenues.reduce((a, b) => a + b, 0);
            document.getElementById('totalRevenue').textContent = '$' + totalRevenue.toFixed(2);

            const profits = products.map(p => {
                const price = parseFloat(p.price) || 0;
                const supplierPrice = parseFloat(p.supplierPrice) || 0;
                if (price > 0 && supplierPrice > 0) {
                    return ((price - supplierPrice) / price) * 100;
                }
                return 0;
            }).filter(p => p > 0);
            const avgProfit = profits.length > 0 ? profits.reduce((a, b) => a + b, 0) / profits.length : 0;
            document.getElementById('avgProfit').textContent = avgProfit.toFixed(1) + '%';

            const ratings = products.map(p => parseFloat(p.rating) || 0).filter(r => r > 0);
            const avgRating = ratings.length > 0 ? ratings.reduce((a, b) => a + b, 0) / ratings.length : 0;
            document.getElementById('avgRating').textContent = avgRating.toFixed(1) + ' ⭐';
        }

        document.getElementById('productForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const price = parseFloat(document.getElementById('price').value) || 0;
            const monthlySales = parseFloat(document.getElementById('monthlySales').value) || 0;
            const calculatedRevenue = price * monthlySales;
            const inputRevenue = parseFloat(document.getElementById('monthlyRevenue').value) || 0;

            const product = {
                id: editingId || Date.now(),
                name: document.getElementById('productName').value,
                asin: document.getElementById('asin').value,
                category: document.getElementById('category').value,
                price: document.getElementById('price').value,
                supplier: document.getElementById('supplier').value,
                supplierPrice: document.getElementById('supplierPrice').value,
                fbaCost: document.getElementById('fbaCost').value,
                monthlySales: document.getElementById('monthlySales').value,
                monthlyRevenue: inputRevenue > 0 ? inputRevenue : calculatedRevenue,
                rating: document.getElementById('rating').value,
                reviews: document.getElementById('reviews').value,
                bsr: document.getElementById('bsr').value,
                url: document.getElementById('url').value,
                notes: document.getElementById('notes').value,
                dateAdded: editingId ? products.find(p => p.id === editingId).dateAdded : new Date().toLocaleDateString()
            };

            if (editingId) {
                const index = products.findIndex(p => p.id === editingId);
                products[index] = product;
                alert('✅ Product updated successfully!');
            } else {
                products.unshift(product);
                alert('✅ Product saved successfully!');
            }

            saveProducts();
            displayProducts();
            closeModal();
        });

        function sortTable(column) {
            if (sortColumn === column) {
                sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
            } else {
                sortColumn = column;
                sortDirection = 'asc';
            }

            products.sort((a, b) => {
                let aVal = a[column] || '';
                let bVal = b[column] || '';

                if (['price', 'supplierPrice', 'rating', 'reviews', 'monthlySales', 'monthlyRevenue'].includes(column)) {
                    aVal = parseFloat(aVal) || 0;
                    bVal = parseFloat(bVal) || 0;
                } else {
                    aVal = String(aVal).toLowerCase();
                    bVal = String(bVal).toLowerCase();
                }

                if (aVal < bVal) return sortDirection === 'asc' ? -1 : 1;
                if (aVal > bVal) return sortDirection === 'asc' ? 1 : -1;
                return 0;
            });

            displayProducts();
        }

        function displayProducts(filterText = '') {
            const wrapper = document.getElementById('tableWrapper');
            
            let filteredProducts = products;
            if (filterText) {
                filterText = filterText.toLowerCase();
                filteredProducts = products.filter(p => 
                    (p.name || '').toLowerCase().includes(filterText) ||
                    (p.category || '').toLowerCase().includes(filterText) ||
                    (p.asin || '').toLowerCase().includes(filterText) ||
                    (p.supplier || '').toLowerCase().includes(filterText)
                );
            }

            if (filteredProducts.length === 0) {
                wrapper.innerHTML = `
                    <div class="empty-state">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path>
                        </svg>
                        <p>${filterText ? 'No products found matching your search.' : 'No products saved yet. Click "Add Product" to start!'}</p>
                    </div>
                `;
                return;
            }

            const visibleCols = allColumns.filter(col => visibleColumns[col.key]);

            const table = `
                <table>
                    <thead>
                        <tr>
                            ${visibleCols.map(col => `
                                <th onclick="sortTable('${col.key}')" class="${sortColumn === col.key ? 'sort-' + sortDirection : ''}">
                                    ${col.label}
                                </th>
                            `).join('')}
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${filteredProducts.map(p => `
                            <tr>
                                ${visibleCols.map(col => {
                                    if (col.key === 'name') return `<td><strong>${p.name}</strong></td>`;
                                    if (col.key === 'price' || col.key === 'supplierPrice' || col.key === 'monthlyRevenue' || col.key === 'fbaCost') {
                                        return `<td>${p[col.key] ? '$' + parseFloat(p[col.key]).toFixed(2) : '-'}</td>`;
                                    }
                                    if (col.key === 'rating') {
                                        return `<td>${p.rating ? p.rating + ' ⭐' : '-'}</td>`;
                                    }
                                    return `<td>${p[col.key] || '-'}</td>`;
                                }).join('')}
                                <td>
                                    <div class="action-btns">
                                        ${p.url ? `<button class="btn-small btn-view" onclick="window.open('${p.url}', '_blank')">🔗</button>` : ''}
                                        <button class="btn-small btn-edit" onclick="openModal(${p.id})">✏️</button>
                                        <button class="btn-small btn-delete" onclick="deleteProduct(${p.id})">🗑️</button>
                                    </div>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;

            wrapper.innerHTML = table;
        }

       function deleteProduct(id) {
            if (confirm('Are you sure you want to delete this product?')) {
                products = products.filter(p => p.id !== id);
                saveProducts();
                displayProducts();
                alert('✅ Product deleted successfully!');
            }
        }

        function clearAll() {
            if (confirm('⚠️ Are you sure you want to delete ALL products? This cannot be undone!')) {
                products = [];
                saveProducts();
                displayProducts();
                alert('✅ All products cleared!');
            }
        }

        function exportToJSON() {
            if (products.length === 0) {
                alert('❌ No products to export!');
                return;
            }

            const dataStr = JSON.stringify(products, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `amazon-products-${new Date().toISOString().split('T')[0]}.json`;
            link.click();
            URL.revokeObjectURL(url);
            alert('✅ Products exported successfully!');
        }

        document.getElementById('searchBox').addEventListener('input', function(e) {
            displayProducts(e.target.value);
        });

        // Auto-calculate monthly revenue
        document.getElementById('price').addEventListener('input', calculateRevenue);
        document.getElementById('monthlySales').addEventListener('input', calculateRevenue);

        function calculateRevenue() {
            const price = parseFloat(document.getElementById('price').value) || 0;
            const sales = parseFloat(document.getElementById('monthlySales').value) || 0;
            const revenue = price * sales;
            if (revenue > 0) {
                document.getElementById('monthlyRevenue').placeholder = `Auto: $${revenue.toFixed(2)}`;
            }
        }

        // Initialize on load
        initializeColumns();
        loadProducts();

    </script>
</body>
</html>
